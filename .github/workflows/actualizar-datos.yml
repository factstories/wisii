name: Actualizar datos del SECOP

# Semanal + manual. Si los datos cambian, los commitea y llama al despliegue.
on:
  schedule:
    - cron: "0 9 * * 1"      # lunes 09:00 UTC (04:00 en Colombia)
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      cambios: ${{ steps.commit.outputs.cambios }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar contratos de SECOP II
        env:
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
        run: python3 scripts/fetch_data.py

      # SECOP I casi no cambia, pero se re-descarga por si hay correcciones
      # retroactivas. Si falla, el job se detiene: el CSV no está en el repo, y
      # seguir publicaría el sitio sin sus ~30.000 contratos.
      - name: Descargar contratos de SECOP I
        env:
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
        run: python3 scripts/fetch_secop1.py

      # El contorno de la isla no cambia: se regenera solo a mano (scripts/fetch_geo.py)
      # para no golpear Overpass cada semana.
      - name: Reconstruir los JSON de la web
        run: python3 scripts/build_data.py

      # Frena la publicación si una fuente quedó en cero o los datos cayeron
      # más de lo que explica un cambio real de la fuente.
      - name: Verificar que los datos no se desplomaron
        run: python3 scripts/verificar_datos.py

      - name: Commitear si hubo cambios
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "datos: actualización automática del SECOP"
            git push
            echo "cambios=true" >> "$GITHUB_OUTPUT"
          fi

  # El push del bot no dispara desplegar.yml por sí solo: se llama desde aquí.
  desplegar:
    needs: actualizar
    if: needs.actualizar.outputs.cambios == 'true'
    uses: ./.github/workflows/desplegar.yml
    secrets: inherit
